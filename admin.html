<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FCA 後台管理系統 | AI 智能自動填表版</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Noto+Sans+HK:wght@400;500;700;900&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              yellow: '#FFC400',
              yellowHover: '#E5B000',
              dark: '#0A0A0A',
              card: '#141414',
              surface: '#1E1E1E',
              border: '#2A2A2A'
            }
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Noto Sans HK', sans-serif; background-color: #0A0A0A; color: #FFFFFF; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="min-h-screen flex flex-col bg-brand-dark text-zinc-100">

  <!-- 頂部導航列 -->
  <header class="bg-brand-card border-b border-brand-border px-6 py-4 flex flex-wrap items-center justify-between gap-4 sticky top-0 z-30">
    <div class="flex items-center gap-3">
      <span class="text-xl font-black text-brand-yellow tracking-wider">FCA ADMIN</span>
      <span class="text-xs text-zinc-500 border-l border-zinc-700 pl-3">AI 貼文自動提取 • 一鍵同步至網站</span>
    </div>
    
    <div class="flex items-center gap-2 sm:gap-3">
      <a href="index.html" target="_blank" class="text-xs text-zinc-400 hover:text-brand-yellow transition px-2 py-1">
        ↗ 查看前台
      </a>
      <button onclick="openConfigModal()" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-300 text-xs px-3 py-1.5 rounded-lg border border-zinc-700 transition flex items-center gap-1">
        ⚙️ 系統與 API 設定
      </button>
      <button onclick="exportCsvLocal()" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-300 text-xs px-3 py-1.5 rounded-lg border border-zinc-700 transition">
        📥 備份 CSV
      </button>
      <button id="btnAutoUpload" onclick="autoUploadToGitHub()" class="bg-brand-yellow hover:bg-brand-yellowHover text-black text-xs font-black px-4 py-1.5 rounded-lg transition shadow-lg flex items-center gap-1.5">
        🚀 一鍵自動同步到網站
      </button>
    </div>
  </header>

  <!-- 主要工作區 -->
  <main class="flex-grow p-4 sm:p-6 lg:p-8 max-w-7xl mx-auto w-full grid grid-cols-1 lg:grid-cols-12 gap-8">
    
    <!-- 左側：發布 / 編輯表單 -->
    <section class="lg:col-span-5 bg-brand-card border border-brand-border rounded-2xl p-5 sm:p-6 shadow-xl space-y-4">
      <div class="flex items-center justify-between border-b border-zinc-800 pb-3">
        <h2 id="formTitle" class="text-base font-extrabold text-white flex items-center gap-2">
          <span class="text-brand-yellow">✨</span> 新增餐廳食評
        </h2>
        <button id="cancelEditBtn" onclick="resetForm()" class="hidden text-xs text-zinc-400 hover:text-white underline">
          取消編輯
        </button>
      </div>

      <form id="postForm" onsubmit="handleFormSubmit(event)" class="space-y-3.5 text-xs">
        <input type="hidden" id="editIndex" value="-1" />
        <input type="hidden" id="postId" value="" />

        <!-- 步驟 1: IG 網址 -->
        <div>
          <label class="block text-brand-yellow font-black mb-1">1. Instagram 貼文 / Reel 網址 (URL)</label>
          <input type="url" id="post_url" placeholder="https://www.instagram.com/reel/Cxxxxxx/"
                 onchange="handleUrlChange(this.value)"
                 class="w-full bg-zinc-900 border border-zinc-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-brand-yellow font-mono text-[11px]" />
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-zinc-400 font-bold mb-1">IG Reel ShortCode</label>
            <input type="text" id="shortCode" placeholder="貼上網址自動生成"
                   class="w-full bg-zinc-900 border border-zinc-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-brand-yellow font-mono text-[11px]" />
          </div>
          <div>
            <label class="block text-zinc-400 font-bold mb-1">封面圖片網址 (Image URL)</label>
            <input type="url" id="imageUrl" placeholder="自動配置"
                   oninput="updateImagePreview(this.value)"
                   class="w-full bg-zinc-900 border border-zinc-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-brand-yellow font-mono text-[11px]" />
          </div>
        </div>

        <!-- 封面圖片即時預覽 -->
        <div id="imagePreviewBox" class="hidden p-2 rounded-xl bg-zinc-900/90 border border-zinc-800 flex items-center gap-3">
          <img id="imagePreviewThumb" src="" alt="封面預覽" class="w-12 h-12 object-cover rounded-lg border border-zinc-700 bg-zinc-800" />
          <div class="text-[11px] text-zinc-400 overflow-hidden">
            <p class="text-brand-yellow font-bold">🖼️ 封面圖片已載入</p>
            <p class="truncate text-zinc-500 max-w-[200px]" id="imagePreviewUrlText"></p>
          </div>
        </div>

        <!-- 步驟 2: 貼上 IG 內文並讓 AI 解析 -->
        <div class="p-3 bg-zinc-900/60 rounded-xl border border-zinc-800 space-y-2">
          <div class="flex items-center justify-between">
            <label class="block text-brand-yellow font-black">2. 食評內文 (Caption / 貼文文字)</label>
            <button type="button" id="btnAiExtract" onclick="runAiExtraction()"
                    class="bg-brand-yellow hover:bg-brand-yellowHover text-black font-black px-3 py-1 rounded-md text-[11px] transition shadow flex items-center gap-1">
              ⚡ 讓 AI 智能提取所有欄位
            </button>
          </div>
          <textarea id="caption" rows="4" placeholder="請直接貼上 Instagram 的貼文文字內容（整段複製過來即可，包含 hashtag），然後點擊右上角的「⚡ 讓 AI 智能提取」按鈕..."
                    class="w-full bg-zinc-950 border border-zinc-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-brand-yellow leading-relaxed text-xs"></textarea>
        </div>

        <!-- 步驟 3: 自動填入的結果 (亦可手動微調) -->
        <div>
          <label class="block text-zinc-400 font-bold mb-1">餐廳名稱 *</label>
          <input type="text" id="restaurant_name" required placeholder="AI 自動填寫或手動修改"
                 class="w-full bg-zinc-900 border border-zinc-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-brand-yellow" />
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-zinc-400 font-bold mb-1">地區 *</label>
            <input type="text" id="district" required placeholder="AI 自動填寫 (例：中環)"
                   class="w-full bg-zinc-900 border border-zinc-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-brand-yellow" />
          </div>
          <div>
            <label class="block text-zinc-400 font-bold mb-1">菜式種類 *</label>
            <input type="text" id="cuisine" required placeholder="AI 自動填寫 (例：西式)"
                   class="w-full bg-zinc-900 border border-zinc-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-brand-yellow" />
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-zinc-400 font-bold mb-1">預算 / 人均價格</label>
            <input type="text" id="price" placeholder="AI 自動填寫 (例：$200 - $400)"
                   class="w-full bg-zinc-900 border border-zinc-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-brand-yellow" />
          </div>
          <div>
            <label class="block text-zinc-400 font-bold mb-1">適合場景</label>
            <input type="text" id="occasion" placeholder="AI 自動填寫 (例：拍拖約會)"
                   class="w-full bg-zinc-900 border border-zinc-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-brand-yellow" />
          </div>
        </div>

        <div>
          <label class="block text-zinc-400 font-bold mb-1">招牌菜式 / 必食推介</label>
          <input type="text" id="must_try" placeholder="AI 自動填寫招牌菜式"
                 class="w-full bg-zinc-900 border border-zinc-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-brand-yellow" />
        </div>

        <button type="submit" id="submitBtn"
                class="w-full bg-brand-yellow hover:bg-brand-yellowHover text-black font-extrabold py-2.5 rounded-lg transition shadow-lg text-sm mt-2">
          暫存至列表
        </button>
      </form>
    </section>

    <!-- 右側：資料庫列表 -->
    <section class="lg:col-span-7 bg-brand-card border border-brand-border rounded-2xl p-5 sm:p-6 shadow-xl flex flex-col">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-zinc-800 pb-3 mb-4">
        <div>
          <h2 class="text-base font-extrabold text-white flex items-center gap-2">
            <span>📚</span> 餐廳資料庫列表 (<span id="totalItemsCount" class="text-brand-yellow">0</span> 間)
          </h2>
          <span class="text-[11px] text-zinc-400">確認無誤後，點擊右上角「🚀 一鍵自動同步到網站」完成發布</span>
        </div>
        <div class="relative">
          <input type="text" id="adminSearchInput" oninput="renderTable()" placeholder="快速搜尋餐廳、地區..."
                 class="bg-zinc-900 border border-zinc-700 text-xs text-white rounded-full pl-7 pr-3 py-1.5 focus:outline-none focus:border-brand-yellow w-48 sm:w-56" />
          <span class="absolute left-2.5 top-2 text-zinc-500 text-xs">🔍</span>
        </div>
      </div>

      <!-- 表格清單 -->
      <div class="overflow-x-auto flex-grow max-h-[650px] no-scrollbar">
        <table class="w-full text-left text-xs">
          <thead class="bg-zinc-900/90 sticky top-0 text-zinc-400 border-b border-zinc-800">
            <tr>
              <th class="py-2.5 px-3">餐廳名稱</th>
              <th class="py-2.5 px-2">地區</th>
              <th class="py-2.5 px-2">菜式</th>
              <th class="py-2.5 px-2">預算</th>
              <th class="py-2.5 px-3 text-right">操作</th>
            </tr>
          </thead>
          <tbody id="restaurantTableBody" class="divide-y divide-zinc-800/60 text-zinc-200">
            <tr>
              <td colspan="5" class="py-12 text-center text-zinc-500">正在讀取資料庫中...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <!-- 系統與 API 設定彈窗 -->
  <div id="configModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-brand-card border border-brand-border rounded-2xl max-w-md w-full p-6 space-y-4 shadow-2xl relative">
      <div class="flex items-center justify-between border-b border-zinc-800 pb-3">
        <h3 class="font-bold text-white text-base">⚙️ 系統與 API 設定</h3>
        <button onclick="closeConfigModal()" class="text-zinc-400 hover:text-white">✕</button>
      </div>
      <p class="text-xs text-zinc-400 leading-relaxed">
        設定一次後會安全保存在本機瀏覽器中。
      </p>
      <div class="space-y-3 text-xs">
        <div>
          <label class="block text-brand-yellow font-bold mb-1">Google Gemini API Key (用於 AI 全自動填表)</label>
          <input type="password" id="cfgGeminiKey" placeholder="AIzaSyxxxxxxxxxxxxxxxxxxxx"
                 class="w-full bg-zinc-900 border border-zinc-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-brand-yellow font-mono text-[11px]" />
        </div>
        <div class="border-t border-zinc-800 pt-3">
          <label class="block text-zinc-300 font-bold mb-1">GitHub 使用者帳號 (Owner)</label>
          <input type="text" id="cfgOwner" placeholder="例如：your-github-username"
                 class="w-full bg-zinc-900 border border-zinc-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-brand-yellow" />
        </div>
        <div>
          <label class="block text-zinc-300 font-bold mb-1">GitHub 倉庫名稱 (Repo)</label>
          <input type="text" id="cfgRepo" placeholder="例如：foodcafealcoholic"
                 class="w-full bg-zinc-900 border border-zinc-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-brand-yellow" />
        </div>
        <div>
          <label class="block text-zinc-300 font-bold mb-1">GitHub 分支名稱 (Branch)</label>
          <input type="text" id="cfgBranch" value="main"
                 class="w-full bg-zinc-900 border border-zinc-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-brand-yellow" />
        </div>
        <div>
          <label class="block text-zinc-300 font-bold mb-1">GitHub Token (PAT)</label>
          <input type="password" id="cfgToken" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx"
                 class="w-full bg-zinc-900 border border-zinc-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-brand-yellow font-mono text-[11px]" />
        </div>
      </div>
      <div class="pt-2 flex justify-end gap-2">
        <button onclick="closeConfigModal()" class="px-4 py-2 rounded-lg bg-zinc-800 text-xs text-zinc-300 hover:bg-zinc-700">取消</button>
        <button onclick="saveConfig()" class="px-4 py-2 rounded-lg bg-brand-yellow text-black text-xs font-bold hover:bg-brand-yellowHover">儲存設定</button>
      </div>
    </div>
  </div>

  <script>
    let adminList = [];
    const CSV_FILENAME = 'cleaned_data_final.csv';

    function loadConfig() {
      return {
        geminiKey: localStorage.getItem('fca_gemini_key') || '',
        owner: localStorage.getItem('fca_gh_owner') || '',
        repo: localStorage.getItem('fca_gh_repo') || '',
        branch: localStorage.getItem('fca_gh_branch') || 'main',
        token: localStorage.getItem('fca_gh_token') || ''
      };
    }

    function openConfigModal() {
      const cfg = loadConfig();
      document.getElementById('cfgGeminiKey').value = cfg.geminiKey;
      document.getElementById('cfgOwner').value = cfg.owner;
      document.getElementById('cfgRepo').value = cfg.repo;
      document.getElementById('cfgBranch').value = cfg.branch;
      document.getElementById('cfgToken').value = cfg.token;
      document.getElementById('configModal').classList.remove('hidden');
    }

    function closeConfigModal() {
      document.getElementById('configModal').classList.add('hidden');
    }

    function saveConfig() {
      const geminiKey = document.getElementById('cfgGeminiKey').value.trim();
      const owner = document.getElementById('cfgOwner').value.trim();
      const repo = document.getElementById('cfgRepo').value.trim();
      const branch = document.getElementById('cfgBranch').value.trim() || 'main';
      const token = document.getElementById('cfgToken').value.trim();

      if (!owner || !repo || !token) {
        alert('請填寫完整 GitHub 帳號、倉庫名稱與 Token！');
        return;
      }

      localStorage.setItem('fca_gemini_key', geminiKey);
      localStorage.setItem('fca_gh_owner', owner);
      localStorage.setItem('fca_gh_repo', repo);
      localStorage.setItem('fca_gh_branch', branch);
      localStorage.setItem('fca_gh_token', token);

      alert('✅ 設定已順利儲存！');
      closeConfigModal();
    }

    function initLoadData() {
      fetch(`${CSV_FILENAME}?t=` + Date.now())
        .then(res => {
          if (!res.ok) throw new Error('無法讀取 CSV');
          return res.text();
        })
        .then(csvText => {
          Papa.parse(csvText, {
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
              adminList = results.data.filter(r => r && r.restaurant_name);
              renderTable();
            }
          });
        })
        .catch(err => {
          console.warn('載入提示:', err.message);
          renderTable();
        });
    }

    function renderTable() {
      const tbody = document.getElementById('restaurantTableBody');
      const countEl = document.getElementById('totalItemsCount');
      const query = document.getElementById('adminSearchInput').value.trim().toLowerCase();

      countEl.innerText = adminList.length;

      let filtered = adminList.map((item, originalIndex) => ({ item, originalIndex }));
      if (query) {
        filtered = filtered.filter(({ item }) => {
          return (item.restaurant_name || '').toLowerCase().includes(query) ||
                 (item.district || '').toLowerCase().includes(query) ||
                 (item.cuisine || '').toLowerCase().includes(query);
        });
      }

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="py-10 text-center text-zinc-500">找不到符合條件的餐廳</td></tr>`;
        return;
      }

      tbody.innerHTML = filtered.map(({ item, originalIndex }) => `
        <tr class="hover:bg-zinc-900/60 transition">
          <td class="py-2.5 px-3 font-bold text-white max-w-[160px] truncate" title="${item.restaurant_name || ''}">
            ${item.restaurant_name || '未命名'}
          </td>
          <td class="py-2.5 px-2 text-zinc-300">${item.district || '-'}</td>
          <td class="py-2.5 px-2 text-zinc-300">${item.cuisine || '-'}</td>
          <td class="py-2.5 px-2 text-brand-yellow font-medium">${item.price || '-'}</td>
          <td class="py-2.5 px-3 text-right space-x-2">
            <button onclick="editItem(${originalIndex})" class="text-brand-yellow hover:underline font-bold">編輯</button>
            <button onclick="deleteItem(${originalIndex})" class="text-red-400 hover:underline">刪除</button>
          </td>
        </tr>
      `).join('');
    }

    function updateImagePreview(url) {
      const box = document.getElementById('imagePreviewBox');
      const thumb = document.getElementById('imagePreviewThumb');
      const text = document.getElementById('imagePreviewUrlText');
      if (url && url.startsWith('http')) {
        thumb.src = url;
        text.innerText = url;
        box.classList.remove('hidden');
      } else {
        box.classList.add('hidden');
      }
    }

    // 當輸入或貼上 IG 網址時，自動抓取 ShortCode 與官方直連封面
    function handleUrlChange(postUrl) {
      if (!postUrl) return;
      const match = postUrl.match(/\/(?:p|reel|reels)\/([A-Za-z0-9_-]+)/);
      if (match && match[1]) {
        const code = match[1];
        document.getElementById('shortCode').value = code;
        const officialMediaUrl = `https://www.instagram.com/p/${code}/media/?size=l`;
        document.getElementById('imageUrl').value = officialMediaUrl;
        updateImagePreview(officialMediaUrl);
      }
    }

    // ⭐ 點擊按鈕直接呼叫 Gemini 進行結構化填表
    async function runAiExtraction() {
      const textToAnalyze = document.getElementById('caption').value.trim();
      const cfg = loadConfig();

      if (!textToAnalyze) {
        alert('請先在下方「食評內文」框貼上 IG 貼文文字（整段複製貼上即可）！');
        return;
      }

      if (!cfg.geminiKey) {
        alert('尚未設定 Gemini API Key！請點擊右上角「⚙️ 系統與 API 設定」填入金鑰。');
        openConfigModal();
        return;
      }

      const btn = document.getElementById('btnAiExtract');
      const originalText = btn.innerText;
      btn.innerText = '🤖 AI 正在精準提取資料...';
      btn.disabled = true;

      try {
        const promptText = `你是一位香港美食指南資料庫專員。請從以下美食 IG 貼文內容中，提取資料並僅回傳純 JSON，不得加上任何 Markdown 語法標籤（不要加 \`\`\`json）：
{
  "restaurant_name": "餐廳名稱 (去除多餘形容詞或店鋪代號)",
  "district": "地區 (例如：中環、銅鑼灣、尖沙咀、旺角、觀塘，若未明確說明請推斷)",
  "cuisine": "菜式種類 (例如：日本料理、西式、酒吧、Cafe、燒肉、火鍋)",
  "price": "人均價格預算 (例如：$200 - $400，若未提及請根據菜式合理推估或填寫 $100 - $200)",
  "occasion": "適合場景 (例如：拍拖約會、朋友聚會、深夜食堂、商務聚餐)",
  "must_try": "招牌菜式或必食推介 (精選 1-3 個重點菜名)"
}

貼文內容如下：
${textToAnalyze}`;

// 依序嘗試最新可用的 Flash 模型
        const candidateModels = ['gemini-2.5-flash', 'gemini-2.0-flash', 'gemini-1.5-flash-latest'];
        let aiData = null;
        let lastError = null;

        for (const model of candidateModels) {
          try {
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${cfg.geminiKey}`;
            const res = await fetch(apiUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                contents: [{ parts: [{ text: promptText }] }]
              })
            });
            const data = await res.json();
            if (res.ok && data.candidates && data.candidates.length > 0) {
              aiData = data;
              break;
            } else if (data.error) {
              lastError = data.error.message;
            }
          } catch (e) {
            lastError = e.message;
          }
        }

        if (!aiData) {
          throw new Error(lastError || '無法透過可用模型生成內容，請確認 API Key 是否有效。');
        }

        if (aiData.error) {
          throw new Error(`Google API 錯誤: ${aiData.error.message}`);
        }

        if (!aiData.candidates || aiData.candidates.length === 0) {
          throw new Error('AI 未能產生內容，請稍後重試。');
        }

        let rawJson = aiData.candidates[0].content.parts[0].text.trim();
        rawJson = rawJson.replace(/^```json\s*/, '').replace(/\s*```$/, '');
        const extracted = JSON.parse(rawJson);

        if (extracted.restaurant_name) document.getElementById('restaurant_name').value = extracted.restaurant_name;
        if (extracted.district) document.getElementById('district').value = extracted.district;
        if (extracted.cuisine) document.getElementById('cuisine').value = extracted.cuisine;
        if (extracted.price) document.getElementById('price').value = extracted.price;
        if (extracted.occasion) document.getElementById('occasion').value = extracted.occasion;
        if (extracted.must_try) document.getElementById('must_try').value = extracted.must_try;

        alert(`🎉 AI 已成功為你填妥所有欄位！\n\n餐廳名：${extracted.restaurant_name}\n地區：${extracted.district}`);
      } catch (err) {
        alert('AI 解析異常: ' + err.message);
      } finally {
        btn.innerText = originalText;
        btn.disabled = false;
      }
    }

    function handleFormSubmit(e) {
      e.preventDefault();

      const editIdx = parseInt(document.getElementById('editIndex').value, 10);
      const postUrl = document.getElementById('post_url').value.trim();
      let code = document.getElementById('shortCode').value.trim();

      if (!code && postUrl) {
        const match = postUrl.match(/\/(?:p|reel|reels)\/([A-Za-z0-9_-]+)/);
        if (match) code = match[1];
      }

      const itemData = {
        id: document.getElementById('postId').value || (code || `post_${Date.now()}`),
        restaurant_name: document.getElementById('restaurant_name').value.trim(),
        district: document.getElementById('district').value.trim(),
        cuisine: document.getElementById('cuisine').value.trim(),
        price: document.getElementById('price').value.trim(),
        occasion: document.getElementById('occasion').value.trim(),
        must_try: document.getElementById('must_try').value.trim(),
        url: postUrl,
        shortCode: code,
        imageUrl: document.getElementById('imageUrl').value.trim(),
        caption: document.getElementById('caption').value.trim()
      };

      if (editIdx >= 0 && editIdx < adminList.length) {
        adminList[editIdx] = { ...adminList[editIdx], ...itemData };
        alert(`已成功更新《${itemData.restaurant_name}》！\n請記得點擊右上角「🚀 一鍵自動同步到網站」完成發布。`);
      } else {
        adminList.unshift(itemData);
        alert(`已成功將《${itemData.restaurant_name}》加入清單首位！\n請記得點擊右上角「🚀 一鍵自動同步到網站」完成發布。`);
      }

      resetForm();
      renderTable();
    }

    function editItem(index) {
      const item = adminList[index];
      if (!item) return;

      document.getElementById('editIndex').value = index;
      document.getElementById('postId').value = item.id || '';
      document.getElementById('restaurant_name').value = item.restaurant_name || '';
      document.getElementById('district').value = item.district || '';
      document.getElementById('cuisine').value = item.cuisine || '';
      document.getElementById('price').value = item.price || '';
      document.getElementById('occasion').value = item.occasion || '';
      document.getElementById('must_try').value = item.must_try || item.signature_dishes || '';
      document.getElementById('post_url').value = item.url || item.postUrl || '';
      document.getElementById('shortCode').value = item.shortCode || item.shortcode || '';
      
      const imgUrl = item.imageUrl || item.displayUrl || item.image || '';
      document.getElementById('imageUrl').value = imgUrl;
      updateImagePreview(imgUrl);

      document.getElementById('caption').value = item.caption || '';

      document.getElementById('formTitle').innerHTML = `<span class="text-brand-yellow">✏️</span> 正在編輯：《${item.restaurant_name}》`;
      document.getElementById('submitBtn').innerText = '儲存修改';
      document.getElementById('cancelEditBtn').classList.remove('hidden');

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function deleteItem(index) {
      const item = adminList[index];
      if (!item) return;

      if (confirm(`確定要刪除《${item.restaurant_name}》嗎？`)) {
        adminList.splice(index, 1);
        renderTable();
      }
    }

    function resetForm() {
      document.getElementById('postForm').reset();
      document.getElementById('editIndex').value = '-1';
      document.getElementById('postId').value = '';
      document.getElementById('formTitle').innerHTML = `<span class="text-brand-yellow">✨</span> 新增餐廳食評`;
      document.getElementById('submitBtn').innerText = '暫存至列表';
      document.getElementById('cancelEditBtn').classList.add('hidden');
      document.getElementById('imagePreviewBox').classList.add('hidden');
    }

    async function autoUploadToGitHub() {
      const cfg = loadConfig();
      if (!cfg.owner || !cfg.repo || !cfg.token) {
        alert('尚未設定 GitHub 憑證，請先點擊「⚙️ 系統與 API 設定」填寫！');
        openConfigModal();
        return;
      }

      const uploadBtn = document.getElementById('btnAutoUpload');
      uploadBtn.disabled = true;
      uploadBtn.innerText = '⏳ 正在同步至 GitHub...';

      try {
        const csvText = Papa.unparse(adminList);
        const utf8Bytes = new TextEncoder().encode(csvText);
        let binaryStr = '';
        utf8Bytes.forEach(b => binaryStr += String.fromCharCode(b));
        const base64Content = btoa(binaryStr);

        const apiUrl = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${CSV_FILENAME}?ref=${cfg.branch}`;
        const getRes = await fetch(apiUrl, {
          headers: {
            'Authorization': `Bearer ${cfg.token}`,
            'Accept': 'application/vnd.github.v3+json'
          }
        });

        let fileSha = null;
        if (getRes.ok) {
          const fileData = await getRes.json();
          fileSha = fileData.sha;
        }

        const payload = {
          message: `Update ${CSV_FILENAME} via FCA Admin Panel (${new Date().toLocaleString()})`,
          content: base64Content,
          branch: cfg.branch
        };
        if (fileSha) payload.sha = fileSha;

        const putRes = await fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${CSV_FILENAME}`, {
          method: 'PUT',
          headers: {
            'Authorization': `Bearer ${cfg.token}`,
            'Content-Type': 'application/json',
            'Accept': 'application/vnd.github.v3+json'
          },
          body: JSON.stringify(payload)
        });

        if (!putRes.ok) {
          const errData = await putRes.json();
          throw new Error(errData.message || 'GitHub API 回應錯誤');
        }

        alert('🎉 成功自動上傳並 Commit 至 GitHub！\n\n約 30-45 秒後前台網站將會自動更新。');
      } catch (err) {
        alert('❌ 上傳失敗: ' + err.message + '\n\n請檢查 GitHub Token 權限是否包含 repo。');
      } finally {
        uploadBtn.disabled = false;
        uploadBtn.innerText = '🚀 一鍵自動同步到網站';
      }
    }

    function exportCsvLocal() {
      const csvContent = Papa.unparse(adminList);
      const blob = new Blob(["\uFEFF" + csvContent], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = CSV_FILENAME;
      link.click();
    }

    initLoadData();
  </script>
